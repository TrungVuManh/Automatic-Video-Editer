# Cấu hình mặc định — đầy đủ mọi khóa.
#
# Thứ tự ưu tiên (cao đè thấp):
#   cờ CLI  >  biến môi trường / .env  >  profile (--profile <tên>)  >  file này
#
# Profile là configs/<tên>.yaml, chỉ cần ghi các khóa muốn đổi.
# Tên biến môi trường tương ứng xem .env.example.

app:
  log_level: INFO            # DEBUG | INFO | WARNING | ERROR (console; file log luôn DEBUG)

paths:
  data_dir: data             # tương đối so với thư mục gốc dự án
  assets_dir: assets

whisper:
  model: large-v3
  language: vi
  device: cuda               # cuda | cpu | auto
  compute_type: float16      # float16 (GPU) | int8_float16 | int8 (CPU)
  beam_size: 5
  vad_filter: true           # bỏ qua đoạn im lặng — nhanh hơn và đỡ bịa chữ
  # Whisper mặc định lấy câu trước làm ngữ cảnh cho câu sau; gặp nhạc hoặc im lặng thì dễ
  # lặp một câu mãi. Tắt đi thì mỗi đoạn độc lập, an toàn hơn với video ngắn.
  condition_on_previous_text: false
  # Gợi ý từ vựng + cách viết có dấu câu cho Whisper, ví dụ prompts/whisper_livestream_vi.txt.
  # Để trống (null) = không gợi ý. Đổi file thì Whisper nhận dạng lại (khóa cache đổi).
  hotwords_file: null
  # Whisper hay "bịa" câu quen thuộc ở đoạn im lặng/nhạc. Câu bị bỏ khi nói nhanh vô lý, hoặc là
  # câu quen thuộc dưới đây kèm dấu hiệu im lặng. Áp dụng cả cho transcript đã cache.
  drop_hallucinations: true
  max_words_per_second: 10   # tiếng Việt nói nhanh cỡ 6–7 từ/giây
  no_speech_threshold: 0.6   # Whisper tự báo xác suất "không có tiếng nói"
  hallucination_phrases:
    - cảm ơn các bạn đã theo dõi
    - cảm ơn các bạn đã xem
    - hẹn gặp lại các bạn
    - đăng ký kênh
    - subscribe cho kênh
    - ghiền mì gõ
    - la la school
    - lalaschool
    - không bỏ lỡ những video hấp dẫn
    - thanks for watching
    - subtitles by

llm:
  backend: ollama            # ollama (local, mặc định) | claude (cần ANTHROPIC_API_KEY)

ollama:
  host: http://localhost:11434
  model: qwen3:8b            # máy yếu hơn: qwen3:4b; qwen3:14b chậm ~2,6× mà không tốt hơn (HANDOFF phiên 16)

claude:
  model: claude-opus-5
  effort: low                # low | medium | high | xhigh | max — chọn meme từng câu nên low là đủ

analyzer:
  previous_segments: 2       # số câu trước CURRENT trong context window (SPEC §18)
  next_segments: 1           # số câu sau CURRENT
  timing_delay: 0.15         # meme bắt đầu sau cuối câu 150 ms (SPEC §52)
  max_tokens: 16000          # trần output khi dùng Claude (gồm phần suy nghĩ); chỉ tính tiền phần thực sinh ra
  split_long_segments: true  # tách đoạn Whisper dài theo khoảng lặng giữa các từ → meme bám đúng câu
  max_segment_seconds: 4.0   # đoạn dài hơn chừng này thì tách
  split_pause: 0.3           # khoảng lặng giữa hai từ (giây) được coi là ranh giới câu

meme_search:
  base_url: http://127.0.0.1:3000
  token: ""
  top_k: 10
  max_download_mb: 25       # chặn response bất thường trước khi ghi vào cache

editing:
  max_memes_per_minute: 5
  cooldown: 7.0              # giây tối thiểu giữa hai meme
  threshold: 0.65            # bỏ cơ hội có confidence thấp hơn mức này

meme:
  library_file: assets/memes/library.jsonl
  duration_min: 0.8          # giây
  duration_max: 2.5
  scale_default: 0.30        # bề rộng meme = 30% bề rộng video (SPEC §38)
  position_default: bottom-right   # top-left | top-right | bottom-left | bottom-right | center
  margin_ratio: 0.03         # lề của meme, tính theo bề rộng video
  max_height_ratio: 0.45     # meme cao tối đa 45% khung — GIF/ảnh khổ dọc không che nửa màn hình
  exclude_styles: []         # nhãn phong cách không được tự chọn, ví dụ [comparison, dialogue]
  position_cycle: []         # vị trí luân phiên cho meme góc, ví dụ [top-right, bottom-right]

sfx:
  enabled: true
  library_file: assets/sfx/library.jsonl
  volume: 0.35               # master volume; còn nhân với mức khuyến nghị từng âm
  score_threshold: 0.35      # bỏ kết quả local không đủ khớp ngữ nghĩa
  cooldown: 8.0              # tránh rải âm liên tục làm mệt tai
  max_per_minute: 3
  duration_max: 2.0

ranking:
  semantic_weight: 0.45
  emotion_weight: 0.20
  style_weight: 0.10
  quality_weight: 0.10
  novelty_weight: 0.15
  duplicate_penalty: 0.30
  recent_window: 60          # giây — phạt nếu cùng meme vừa được dùng (SPEC §31)

cutaway:
  # Meme tràn màn hình (cutaway) cho punchline mạnh nhất — kiểu dựng của kênh game chuyên nghiệp.
  # Mặc định chỉ render khi bạn chọn "Tràn màn hình" trong web; profile `pro` bật tự động.
  mode: never                # never | auto — builder có tự chọn cú cắt tràn màn hình không
  max_per_minute: 2
  max_share: 0.5             # tối đa 50% số meme là cú cắt — hiếm mới "đắt" (kiểu HK15)
  cooldown: 15               # giây giữa hai cú cắt (tính từ lúc bắt đầu)
  min_confidence: 0.8        # chỉ khoảnh khắc AI tự tin nhất mới được cắt tràn màn hình
  duration_min: 0.8
  duration_max: 1.3
  sfx_on_cut: true           # mỗi cú cắt kèm một SFX
  sfx_query: impact          # truy vấn SFX khi AI không đề xuất âm nào
  sfx_volume: 0.6            # SFX lúc cắt to hơn SFX thường (0.35) — ngang giọng nói khi tiếng gốc đang giảm
  punch_zoom: true           # zoom vào gameplay ngay trước cú cắt
  zoom_factor: 1.1
  zoom_duration: 0.3
  inset: 0.92                # meme chiếm tối đa 92% khung, chừa viền nền mờ
  blur: 24                   # nền = chính meme phóng lấp khung, làm mờ
  darken: -0.18              # làm tối nền để meme nổi lên
  settle_zoom: 1.06          # vào khung ở 106% rồi thu về 100%
  settle_time: 0.15
  fade_in: 0.06
  fade_out: 0.08
  duck_volume: 0.35          # tiếng gốc còn 35% trong lúc cắt
  duck_ramp: 0.08
  limiter: 0.891             # chặn đỉnh ≈ −1 dBFS sau khi trộn SFX

download:
  # Tải video YouTube bằng yt-dlp: `automeme download <link>` hoặc `automeme run <link>`.
  max_height: 1080           # độ phân giải dọc tối đa; cao hơn chỉ tốn dung lượng
  max_duration: 600          # giây — video/đoạn dài hơn thì phải chọn --from/--to
  max_filesize_mb: 1024
  js_runtime: auto           # auto | deno | node | bun | none — YouTube cần JS runtime để giải mã
  # Link có mốc thời gian (&t=3750s, "Sao chép URL tại thời điểm hiện tại") mà không nhập --to:
  # tải đoạn dài chừng này tính từ mốc đó.
  clip_seconds: 90
  # Kênh của bạn — video từ các kênh này không hiện cảnh báo bản quyền. Nên đặt trong .env
  # (YOUTUBE_OWN_CHANNELS=@kenh_cua_ban) thay vì sửa file này, để không commit thông tin riêng.
  own_channels: []

output:
  video_codec: libx264
  audio_codec: aac
  crf: 18
  preset: medium
