[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automeme"
version = "0.1.0"
description = "AI tự động tìm khoảnh khắc phù hợp và chèn meme/reaction vào video tiếng Việt"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Nhận dạng giọng nói (Iteration 1). Chạy CPU thì chỉ cần [asr];
# chạy GPU NVIDIA cần thêm cuBLAS + cuDNN 9 của CUDA 12 → dùng [asr-cuda].
asr = ["faster-whisper>=1.0"]
asr-cuda = [
    "faster-whisper>=1.0",
    "nvidia-cublas-cu12>=12.3",
    "nvidia-cudnn-cu12>=9.1,<10",
]
# Backend LLM tùy chọn thay cho Ollama (llm.backend: claude)
claude = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
automeme = "automeme.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
