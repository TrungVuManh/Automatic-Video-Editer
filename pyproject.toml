[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automeme"
version = "0.1.0"
description = "AI tự động chèn meme, reaction GIF và sound effect vào video tiếng Việt"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Tải video YouTube (Unlicense). YouTube đổi liên tục nên cần cập nhật thường xuyên:
    # python -m pip install -U yt-dlp
    "yt-dlp>=2026.8.19",
    # Script giải thử thách JavaScript của YouTube. Phiên bản phải KHỚP ĐÚNG bản mà yt-dlp đang
    # cài yêu cầu — `automeme doctor` đọc yêu cầu đó và in lệnh cài chính xác khi bị lệch.
    "yt-dlp-ejs>=0.8.0",
]

[project.optional-dependencies]
# Nhận dạng giọng nói (Iteration 1). Chạy CPU thì chỉ cần [asr];
# chạy GPU NVIDIA cần thêm cuBLAS + cuDNN 9 của CUDA 12 → dùng [asr-cuda].
asr = ["faster-whisper>=1.0"]
asr-cuda = [
    "faster-whisper>=1.0",
    "nvidia-cublas-cu12>=12.3",
    "nvidia-cudnn-cu12>=9.1,<10",
]
# Phân tích local bằng Ollama (Iteration 3). Ollama server/model được cài riêng.
llm = ["ollama>=0.6.2"]
# Backend LLM tùy chọn thay cho Ollama (llm.backend: claude)
claude = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
automeme = "automeme.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"automeme.review" = ["static/*.html", "static/*.css", "static/*.js"]
"automeme.memes" = ["catalog/*.json"]
"automeme.sfx" = ["catalog/*.json"]
"automeme.studio" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/vendor/*.css",
    "static/vendor/*.js",
    "static/vendor/*.mjs",
    "static/vendor/*.svg",
    "static/vendor/licenses/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
